<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EUONE – payments prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--sf:#FFFFFF;--ink:#080D1C;--mut:#6B6785;--line:#DDD6FE;--ac:#7C3AED;--bl:#3B82F6;--acs:#F3E8FF;--in:#0F9D58;--warn:#B54708;--dn:#D92D20;--dim:#BDB8D6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#080D1C;--sf:#121A33;--ink:#F3E8FF;--mut:#A5A1C2;--line:#2E2766;--ac:#8B5CF6;--bl:#3B82F6;--acs:#2A1B52;--in:#3DD68C;--warn:#F5A55B;--dn:#F97066;--dim:#3A3560}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{padding-top:34px;background:var(--bg);color:var(--ink);font:400 15px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:430px;min-height:calc(100vh - 34px);display:flex;flex-direction:column;position:relative}
.scr{flex:1;padding:18px 18px 110px;overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
h2{font-size:17px;font-weight:600}
.mut{color:var(--mut)}.sm{font-size:13px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.back{width:38px;height:38px;border-radius:12px;background:var(--sf);display:grid;place-items:center}
.sim{background:var(--acs);color:var(--ac);font-size:12px;padding:6px 12px;border-radius:99px;display:inline-block;margin-bottom:14px}
.bal{background:linear-gradient(135deg,#080D1C 0%,#080D1C 35%,#7C3AED 100%);color:#fff;border-radius:26px;padding:22px 22px 20px;margin-bottom:16px}
.bal .n{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:4px 0 2px}
.bal .l{opacity:.65;font-size:13px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.act{background:var(--sf);border-radius:18px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600}
.act .i{width:42px;height:42px;border-radius:14px;background:var(--acs);color:var(--bl);display:grid;place-items:center}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 10px}
.lnk{color:var(--bl);font-size:13px;font-weight:600}
.card{background:var(--sf);border-radius:20px;padding:6px 14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;width:100%;text-align:left}
.row+.row{border-top:1px solid var(--line)}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;color:#fff}
.grow{flex:1;min-width:0}.grow b{display:block;font-weight:600}
.amt{font-weight:600;white-space:nowrap}.pos{color:var(--in)}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:var(--sf);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));align-items:end;z-index:5}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mut);padding:4px 0}
.nav button.on{color:var(--ac);font-weight:600}
.nav button.off{color:var(--dim)}
.nav .qr{color:#fff}.nav .qr span{width:54px;height:54px;border-radius:18px;background:var(--ac);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px rgba(124,58,237,.35)}
.nav .qr{color:var(--mut)}
.inp{width:100%;background:var(--sf);border:1.5px solid var(--line);border-radius:14px;padding:14px;font:inherit;color:var(--ink)}
.inp:focus{border-color:var(--ac);outline:0}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
.btn{width:100%;background:var(--ac);color:#fff;border-radius:16px;padding:16px;font-weight:600;font-size:16px;margin-top:18px}
.btn[disabled]{background:var(--dim);cursor:not-allowed}
.btn.ghost{background:var(--sf);color:var(--ink)}
.err{color:var(--warn);font-size:13px;margin-top:8px}
.big{text-align:center;font-size:52px;font-weight:800;letter-spacing:-.03em;margin:24px 0 4px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:18px}
.pad button{padding:16px;font-size:24px;font-weight:600;border-radius:16px}
.pad button:active{background:var(--sf)}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.chip{padding:8px 14px;border-radius:99px;background:var(--sf);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ac);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bill{background:var(--sf);border-radius:18px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:10px}
.sum{background:var(--sf);border-radius:20px;padding:6px 16px;margin-top:10px}
.sum div{display:flex;justify-content:space-between;padding:12px 0}.sum div+div{border-top:1px solid var(--line)}
.ok{width:84px;height:84px;border-radius:50%;background:var(--in);color:#fff;display:grid;place-items:center;margin:40px auto 18px;animation:pop .35s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.ok{animation:none}}
.vf{aspect-ratio:1;border-radius:28px;background:#080D1C;position:relative;display:grid;place-items:center;overflow:hidden;margin-bottom:16px}
.vf i{position:absolute;width:62%;aspect-ratio:1;border:3px solid #fff;border-radius:22px;opacity:.9}
.vf p{color:#cbd5e6;font-size:13px;position:absolute;bottom:16px}
.soon{opacity:.55;filter:grayscale(1)}
.tag{background:var(--line);color:var(--mut);font-size:11px;padding:3px 8px;border-radius:99px;font-weight:600}
.tg{display:flex;justify-content:space-between;align-items:center;background:var(--sf);border-radius:16px;padding:14px 16px;margin-top:16px;width:100%}
.sw{width:44px;height:26px;border-radius:99px;background:var(--dim);position:relative;transition:.2s}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ac)}.sw.on:after{left:21px}
.card,.sum,.bill,.act,.back,.chip,.tg{border:1px solid var(--line)}.chip.on{border-color:var(--ac)}
.sum div{gap:16px}.sum b{text-align:right;font-weight:600;word-break:break-word}.pill{display:inline-block;padding:5px 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--acs)}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf i{z-index:1}.vf p{z-index:2;background:rgba(8,13,28,.6);padding:6px 12px;border-radius:99px;max-width:86%;text-align:center}
.torch{position:absolute;top:14px;right:14px;z-index:3;width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);color:#fff;display:grid;place-items:center}
.torch[hidden]{display:none}.torch.on{background:#fff;color:#080D1C}
.scanmsg{border-radius:14px;padding:12px 14px;font-size:14px;margin-bottom:12px;background:var(--acs);color:var(--ink)}
.scanmsg.err{background:var(--sf);border:1px solid var(--warn);color:var(--warn)}
.mbar{background:var(--ac);color:#fff;font-size:12px;font-weight:600;text-align:center;padding:6px;letter-spacing:.04em}
.fx{position:fixed;top:env(safe-area-inset-top,0px);left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:34px;z-index:6;display:flex;align-items:center;background:var(--sf);border-bottom:1px solid var(--line);font-size:12.5px}
.fxtag{flex:none;margin:0 6px 0 8px;padding:3px 8px;border-radius:99px;font-size:10.5px;font-weight:800;letter-spacing:.04em;background:var(--acs);color:var(--ac)}
.fxtag.lv{background:rgba(15,157,88,.14);color:var(--in)}.fxtag.st{background:rgba(181,71,8,.14);color:var(--warn)}
.fxview{flex:1;min-width:0;height:100%;overflow:hidden;display:flex;align-items:center;touch-action:pan-y;cursor:grab;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent);mask-image:linear-gradient(90deg,transparent,#000 12px,#000 calc(100% - 12px),transparent)}
.fxtrack{display:flex;width:max-content;will-change:transform}.fxset{display:flex;flex:none}
.fxi{display:flex;align-items:center;gap:6px;height:34px;white-space:nowrap;font-variant-numeric:tabular-nums}
.fxi::after{content:"";width:1px;height:14px;background:var(--line);margin:0 12px 0 8px}
.fxi b{font-weight:600}.fxi em{font-style:normal;font-weight:600}
.up{color:var(--in)}.dn{color:var(--dn)}.fl{color:var(--mut)}
.fxmsg{font-size:12.5px;color:var(--mut);padding:0 8px;text-align:left}
.pb{height:8px;border-radius:99px;background:var(--acs);overflow:hidden}.pb i{display:block;height:100%;background:var(--ac);border-radius:99px}
.back{position:relative}.dot{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:#fff;font-size:11px;font-style:normal;font-weight:600;display:grid;place-items:center;padding:0 4px}
textarea.inp{resize:vertical}summary{cursor:pointer}.nav .qr{white-space:nowrap}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:9}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" defer onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js';document.head.appendChild(s)"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js" defer onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';document.head.appendChild(s)"></script></head>
<body><div id="fx" class="fx" role="region" aria-label="Exchange rate ticker"></div><div id="app"></div>
<script>
const I={
 send:'<path d="M5 12h14M13 6l6 6-6 6"/>',qr:'<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 14h2v2h-2zM14 18h2v2h-2zM18 18h2v2h-2z"/>',
 bill:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/>',home:'<path d="M4 11l8-7 8 7v9H4z"/>',list:'<path d="M5 6h14M5 12h14M5 18h14"/>',
 train:'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M8 21l2-4M16 21l-2-4M5 11h14"/>',chart:'<path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',check:'<path d="M5 12l5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',bell:'<path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 21h4"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 9a3 3 0 100 6 3 3 0 000-6"/>',user:'<path d="M12 12a4 4 0 100-8 4 4 0 000 8zM4 21a8 8 0 0116 0"/>',card:'<path d="M3 6h18v12H3zM3 10h18"/>',shield:'<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 115 0c0 1.5-2.5 2-2.5 3.5M12 17h.01"/>',pie:'<path d="M12 3v9h9a9 9 0 11-9-9z"/>',swap:'<path d="M4 8h14l-3-3M20 16H6l3 3"/>',cal:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/>',bolt:'<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',key:'<circle cx="8" cy="12" r="4"/><path d="M12 12h9M18 12v3"/>',wrench:'<path d="M14 6a4 4 0 005 5l-9 9-3-3 9-9a4 4 0 01-2-2z"/>',wifi:'<path d="M3 9a14 14 0 0118 0M6 13a9 9 0 0112 0M9.5 16.5a4 4 0 015 0"/>',drop:'<path d="M12 3s6 6 6 11a6 6 0 01-12 0c0-5 6-11 6-11z"/>'};
const ic=(n,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;
const eur=n=>n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const COL=['#7C3AED','#3B82F6','#080D1C','#7C3AED','#3B82F6','#080D1C'];
const av=n=>`<div class="av" style="background:${COL[n.length%6]}">${n.split(' ').map(w=>w[0]).join('').slice(0,2).replace(/[<>&"']/g,'')}</div>`;
const CON=[['Lena Fischer','DE89 3704 •••• 4400'],['Matteo Rossi','IT60 X054 •••• 1234'],['Anna Kowalska','PL61 1090 •••• 0000'],['Jonas Weber','DE02 1203 •••• 7891'],['Sofia Martin','FR14 2004 •••• 0120']];
const BILLS=[['Electricity','Stadtwerke München','bolt',64.2,'Customer no.'],['Rent','Hausverwaltung Nord','key',890,'Tenancy ref.'],['Maintenance','WEG Hausgeld','wrench',185,'Unit no.'],['Internet','Vodafone Kabel','wifi',39.99,'Customer no.'],['Water','Wasserwerke Berlin','drop',27.5,'Meter no.']];
const S={bal:2480.35,scr:'home',amt:'',note:'',to:null,bill:null,bf:{},filt:'All',q:'',qrTab:'scan',err:'',notify:{},tx:[
 {n:'Lena Fischer',t:'sent',a:-24,d:'Yesterday',s:'Dinner split'},
 {n:'Vodafone Kabel',t:'bill',a:-39.99,d:'Yesterday',s:'Internet'},
 {n:'Employer GmbH',t:'in',a:2850,d:'1 Oct',s:'Salary'},
 {n:'Hausverwaltung Nord',t:'bill',a:-890,d:'1 Oct',s:'Rent'},
 {n:'Matteo Rossi',t:'in',a:60,d:'28 Sep',s:'Concert tickets'},
 {n:'Stadtwerke München',t:'bill',a:-71.4,d:'25 Sep',s:'Electricity'}]};
const $=document.getElementById('app');
const META=[['18:42','22 Oct 2026','Completed','482913','Dinner split · Trattoria Verde'],['07:00','22 Oct 2026','Completed','482377','Internet · Customer no. 4829-117'],['06:15','1 Oct 2026','Completed','471002','Salary · October 2026'],['08:00','1 Oct 2026','Completed','470988','Rent · Tenancy ref. T-2210 · October'],['21:05','28 Sep 2026','Completed','466540','Concert tickets'],['07:30','25 Sep 2026','Completed','465871','Electricity · Customer no. 7731-204']];
S.tx.forEach((x,i)=>{const m=META[i];x.time=m[0];x.date=m[1];x.st=m[2];x.ref='EU-'+m[3];x.desc=m[4]});
function stamp(x,r,desc,st){const d=new Date();x.time=d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});x.date=d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});x.ref='EU-'+r;x.desc=desc;x.st=st||'Completed';return x}
function openTx(r){const i=S.tx.findIndex(x=>x.ref===r);if(i<0)return;go('txdetail',{ti:i,from:S.scr})}
function go(s,x){S.scr=s;S.err='';if(x)Object.assign(S,x);window.scrollTo(0,0);draw()}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
const head=(t,b)=>`<div class="top"><button class="back" aria-label="Back" onclick="go('${b||'home'}')">${ic('back')}</button><h2>${t}</h2></div>`;
const txRow=x=>`<button class="row" aria-label="Open details: ${x.n}" onclick="openTx('${x.ref}')">${x.t==='bill'?`<div class="av" style="background:var(--acs);color:var(--bl)">${ic('bill',20)}</div>`:av(x.n)}<div class="grow"><b>${x.n}</b><span class="mut sm">${x.s} · ${x.d}</span></div><span class="amt ${x.a>0?'pos':''}">${x.a>0?'+':'−'}${fmc(Math.abs(x.a),x.cur)}</span></button>`;

const V={
home:()=>{const st=spendStats(),un=S.notes.filter(n=>!n.read).length,pc=S.budget?st.curSp/S.budget*100:0;
 return `<div class="scr"><div class="top"><div class="grow"><b style="letter-spacing:.06em;color:var(--ac)">EUONE</b><br><span class="mut sm">Guten Morgen, ${S.prof.name.split(' ')[0]}</span></div><button class="back" aria-label="Notifications${un?', '+un+' unread':''}" onclick="go('notifs')">${ic('bell')}${un?`<i class="dot">${un}</i>`:''}</button><button onclick="go('profile')" aria-label="Profile">${av(S.prof.name)}</button></div>
 <span class="sim">Prototype · simulated money only</span>
 <div class="bal"><div class="l" style="display:flex;justify-content:space-between">Main account · EUR<button onclick="S.pref.hideBal=!S.pref.hideBal;draw()" aria-label="${S.pref.hideBal?'Show':'Hide'} balance" style="color:#fff">${ic('eye',20)}</button></div><div class="n">${S.pref.hideBal?'••••• €':eur(S.bal)}</div><div class="l">Demo account · DE44 5001 •••• 7731 · <button class="lnk" style="color:#fff;text-decoration:underline" onclick="go('fin')">All balances</button></div></div>
 <div class="acts" style="grid-template-columns:repeat(4,1fr);gap:8px"><button class="act" onclick="go('send')"><span class="i">${ic('send')}</span>Send</button><button class="act" onclick="go('request',{ra:'',rr:'',rf:''})"><span class="i">${ic('card')}</span>Request</button><button class="act" onclick="go('scan',{qrTab:'scan'})"><span class="i">${ic('qr')}</span>Scan</button><button class="act" onclick="openFx('USD')"><span class="i">${ic('swap')}</span>Exchange</button></div>
 <div class="sec"><h2>${st.label}</h2><button class="lnk" onclick="go('insights')">Insights</button></div>
 <div class="card" style="padding:14px"><div style="display:flex;justify-content:space-between"><span class="mut">Spent this month</span><b>${eur(st.curSp)}</b></div><div class="pb" style="margin:10px 0 6px" role="img" aria-label="${Math.round(pc)} percent of budget used"><i style="width:${Math.min(100,pc)}%;${pc>100?'background:var(--dn)':''}"></i></div><span class="mut sm">${Math.round(pc)}% of ${eur(S.budget)} budget · ${eur(Math.max(0,S.budget-st.curSp))} left</span></div>
 <div class="sec" style="margin-top:18px"><h2>Upcoming bills</h2><button class="lnk" onclick="go('subs')">See all</button></div>
 <div class="card">${S.subs.filter(x=>x.on).slice(0,2).map(x=>`<div class="row"><div class="grow"><b>${x.n}</b><span class="mut sm">${x.s} · ${x.next}</span></div><span class="amt">${eur(x.a)}</span></div>`).join('')}</div>
 <div class="sec" style="margin-top:18px"><h2>Recent transactions</h2><button class="lnk" onclick="go('history')">View all</button></div>
 <div class="card">${S.tx.slice(0,4).map(txRow).join('')}</div></div>`},
pay:()=>`<div class="scr"><h1 style="margin-bottom:14px">Payments</h1><span class="sim">Simulated · no real money moves</span>
 <div class="acts" style="grid-template-columns:repeat(2,1fr)"><button class="act" onclick="go('send')"><span class="i">${ic('send')}</span>Send money</button><button class="act" onclick="go('request',{ra:'',rr:'',rf:''})"><span class="i">${ic('card')}</span>Request money</button><button class="act" onclick="go('split',{sp:{total:'',desc:'',mode:'equal',who:{},c:{}}})"><span class="i">${ic('list')}</span>Split a bill</button><button class="act" onclick="go('bills')"><span class="i">${ic('bill')}</span>Pay bills</button></div>
 <div class="card">${lr('list','Payment history',S.tx.length+' transactions',"go('history')")}${lr('qr','Requests &amp; payment links',S.reqs.filter(r=>reqSt(r)==='Pending').length+' open',"go('reqs')")}${lr('user','Recipients',CON.length+' saved',"go('recips')")}${lr('list','Split bills',S.splits.length+' created',"go('splits')")}</div></div>`,
reqs:()=>pg('Requests & links','pay',`<button class="btn" style="margin-top:0" onclick="go('request',{ra:'',rr:'',rf:''})">New request</button><div class="card" style="margin-top:14px">${S.reqs.map(r=>`<button class="row" onclick="go('reqd',{rid:'${r.id}'})"><div class="grow"><b>${r.id}</b><span class="mut sm">${r.reason||'Payment request'} · ${reqSt(r)}</span></div><span class="amt">${fmc(r.amt,r.cur)}</span></button>`).join('')||'<p class="mut" style="padding:16px">No requests yet. Create one to get a simulated payment link and QR.</p>'}</div>`),
request:()=>pg('Request money','pay',`<span class="sim">Simulated · creating a request doesn’t move money</span>${inp('Amount','ra',S.ra,'0,00','inputmode="decimal" oninput="S.ra=this.value"')}
 <label for="rc">Currency</label><select class="inp" id="rc" onchange="S.rc=this.value">${['EUR','USD','GBP','PLN'].map(c=>`<option ${c===S.rc?'selected':''}>${c}</option>`).join('')}</select>
 <label for="rf">From (optional)</label><select class="inp" id="rf" onchange="S.rf=this.value"><option value="">Anyone with the link</option>${CON.map(c=>`<option ${c[0]===S.rf?'selected':''}>${c[0]}</option>`).join('')}</select>
 ${inp('Reason','rr',S.rr,'e.g. Concert tickets','maxlength="60" oninput="S.rr=this.value"')}${S.err?`<p class="err">${S.err}</p>`:''}<button class="btn" onclick="mkReq()">Create request</button>`),
reqd:()=>{const r=S.reqs.find(x=>x.id===S.rid),s=reqSt(r),op=s==='Pending';return pg('Request details','reqs',`<div class="card" style="padding:18px;text-align:center">${op?realQr(payloadFor(S.prof.name,r.amt,r.id,r.cur)):''}<div class="big" style="margin:10px 0 4px;font-size:34px">${fmc(r.amt,r.cur)}</div><span class="pill" style="color:${s==='Paid'?'var(--in)':op?'var(--ac)':'var(--warn)'}">${s}</span></div>
 <div class="sum"><div><span class="mut">Request ID</span><b>${r.id}</b></div><div><span class="mut">Reason</span><b>${r.reason||'–'}</b></div><div><span class="mut">From</span><b>${r.from||'Anyone with the link'}</b></div><div><span class="mut">Expires</span><b>${new Date(r.exp).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</b></div><div><span class="mut">Link (simulated)</span><b style="font-size:12px">${r.link}</b></div></div>
 ${op?`<button class="btn ghost" onclick="copyTxt('${r.link}')">Copy link</button><button class="btn" style="margin-top:10px" onclick="reqPaid('${r.id}')">Simulate: payer has paid</button><button class="lnk" style="display:block;margin:14px auto 0" onclick="reqCancel('${r.id}')">Cancel request</button>`:''}<p class="mut sm" style="margin-top:14px">The link and QR are demo only: no real payment service is connected. Your balance changes only when a payment is received.</p>`)},
recips:()=>pg('Recipients','pay',`<button class="btn" style="margin-top:0" onclick="go('addrec',{rn:'',ri:''})">Add recipient</button><div class="card" style="margin-top:14px">${CON.map(c=>`<button class="row" onclick="go('amount',{to:'${c[0]}',amt:''})">${av(c[0])}<div class="grow"><b>${c[0]}</b><span class="mut sm">${c[1]}</span></div><span class="mut">Send ›</span></button>`).join('')}</div>`),
addrec:()=>pg('Add recipient','recips',`<span class="sim">Demo only: nothing is verified with a bank</span>${inp('Name','rn',S.rn,'e.g. Clara Neumann','oninput="S.rn=this.value"')}${inp('IBAN','ri',S.ri,'DE89 3704 0044 0532 0130 00','oninput="S.ri=this.value"')}${S.err?`<p class="err">${S.err}</p>`:''}<button class="btn" onclick="addRec()">Save recipient</button>`),
splits:()=>pg('Split bills','pay',`<button class="btn" style="margin-top:0" onclick="go('split',{sp:{total:'',desc:'',mode:'equal',who:{},c:{}}})">New split</button><div class="card" style="margin-top:14px">${S.splits.map(s=>`<button class="row" onclick="go('splitd',{sid:'${s.id}'})"><div class="grow"><b>${s.desc}</b><span class="mut sm">${s.parts.filter(p=>p.st==='Paid').length} of ${s.parts.length} paid</span></div><span class="amt">${eur(s.total)}</span></button>`).join('')||'<p class="mut" style="padding:16px">No split bills yet.</p>'}</div>`),
split:()=>{const p=S.sp,w=Object.keys(p.who).filter(k=>p.who[k]),T=Math.round(parseFloat(String(p.total).replace(',','.'))*100)||0,sh=Math.floor(T/(w.length+1)),oth=p.mode==='custom'?w.reduce((a,n)=>a+(Math.round(parseFloat(String(p.c[n]||'0').replace(',','.'))*100)||0),0):sh*w.length,me=T-oth;
 return pg('Split a bill','pay',`<p class="mut sm" style="margin-bottom:6px">You pay the bill; the others pay you back.</p>${inp('Total bill (€)','st',p.total,'0,00','inputmode="decimal" oninput="S.sp.total=this.value;draw(\'st\')"')}${inp('Description','sd',p.desc,'e.g. Dinner','maxlength="40" oninput="S.sp.desc=this.value"')}
 <div class="chips" style="margin-top:14px"><button class="chip ${p.mode==='equal'?'on':''}" onclick="S.sp.mode='equal';draw()">Split equally</button><button class="chip ${p.mode==='custom'?'on':''}" onclick="S.sp.mode='custom';draw()">Custom amounts</button></div>
 <div class="card">${CON.slice(0,6).map((c,ci)=>`<div class="row"><button class="grow" style="text-align:left" role="checkbox" aria-checked="${!!p.who[c[0]]}" onclick="togWho('${c[0]}')"><b>${p.who[c[0]]?'☑':'☐'} ${c[0]}</b></button>${p.who[c[0]]&&p.mode==='custom'?`<input class="inp" style="width:100px;padding:8px" inputmode="decimal" id="sc${ci}" aria-label="Share for ${c[0]}" placeholder="0,00" value="${clean(p.c[c[0]]||'')}" oninput="S.sp.c['${c[0]}']=this.value;draw('sc${ci}')">`:p.who[c[0]]&&p.mode==='equal'&&T?`<span class="amt">${eur(sh/100)}</span>`:''}</div>`).join('')}</div>
 <div class="sum"><div><span class="mut">Total</span><b>${eur(T/100)}</b></div><div><span class="mut">Your share</span><b style="color:${me<0?'var(--dn)':'inherit'}">${eur(me/100)}</b></div></div>${me<0?'<p class="err">The shares add up to more than the bill.</p>':''}${S.err?`<p class="err">${S.err}</p>`:''}<button class="btn" onclick="mkSplit()">Create split</button>`)},
splitd:()=>{const s=S.splits.find(x=>x.id===S.sid),paid=s.parts.filter(p=>p.st==='Paid').reduce((a,p)=>a+p.amt,0);return pg(s.desc,'splits',`<div class="sum"><div><span class="mut">Bill total</span><b>${eur(s.total)}</b></div><div><span class="mut">Your share</span><b>${eur(s.mine)}</b></div><div><span class="mut">Collected</span><b>${eur(paid)}</b></div></div>
 <div class="card" style="margin-top:14px">${s.parts.map((p,i)=>`<div class="row">${av(p.n)}<div class="grow"><b>${p.n}</b><span class="mut sm">${eur(p.amt)} · ${p.st}</span></div>${p.st==='Pending'?`<button class="chip" onclick="splitPaid('${s.id}',${i})">Mark paid</button>`:`<span class="pill" style="color:var(--in)">Paid</span>`}</div>`).join('')}</div><p class="mut sm" style="margin-top:12px">“Mark paid” simulates a share arriving and adds it to your balance once.</p>`)},
history:()=>{const q=S.hq.toLowerCase(),cm=spendStats().cur,l=S.tx.filter(x=>(S.filt==='All'||(S.filt==='Sent'&&x.t==='sent')||(S.filt==='Bills'&&x.t==='bill')||(S.filt==='Received'&&x.t==='in'))&&(S.hs==='All'||x.st===S.hs)&&(S.hp==='all'||mkey(x)===cm)&&(!q||(x.n+' '+x.s+' '+x.ref+' '+x.desc).toLowerCase().includes(q)));
 const ch=(a,k,v)=>`<button class="chip ${S[k]===v?'on':''}" onclick="S.${k}='${v}';draw()">${a}</button>`;
 return pg('Payment history','pay',`<input class="inp" id="hq" placeholder="Search name, reference or description" aria-label="Search transactions" value="${clean(S.hq)}" oninput="S.hq=this.value;draw('hq')"><div class="chips" style="margin-top:12px">${['All','Sent','Bills','Received'].map(f=>ch(f,'filt',f)).join('')}</div><div class="chips">${ch('Any status','hs','All')}${ch('Completed','hs','Completed')}${ch('Scheduled','hs','Scheduled')}${ch('All time','hp','all')}${ch('This month','hp','month')}</div><div class="card">${l.map(txRow).join('')||'<p class="mut" style="padding:16px">No transactions match. Try clearing the search or filters.</p>'}</div>`)},
fin:()=>{const st=spendStats(),W={EUR:S.bal,...S.wal},sel=W[S.wsel]!=null?S.wsel:'EUR';
 return `<div class="scr"><h1 style="margin-bottom:14px">Finance</h1><span class="sim">Simulated balances · not linked bank accounts</span>
 <div class="bal"><div class="l">${sel} balance${sel==='EUR'?' · primary currency':''}</div><div class="n">${S.pref.hideBal?'•••••':fmc(W[sel],sel)}</div></div>
 <div class="card">${Object.keys(W).map(c=>`<button class="row" aria-pressed="${c===sel}" onclick="S.wsel='${c}';draw()"><div class="av" style="background:${c===sel?'var(--ac)':'var(--acs)'};color:${c===sel?'#fff':'var(--ac)'}">${c}</div><div class="grow"><b>${c}${c==='EUR'?' · primary':''}</b></div><span class="amt">${S.pref.hideBal?'•••••':fmc(W[c],c)}</span></button>`).join('')}</div>
 <div class="card" style="margin-top:14px">${lr('swap','Currency converter','Preview only: nothing is exchanged',"openFx('USD')")}${lr('pie','Budget planner',eur(st.curSp)+' of '+eur(S.budget)+' used',"go('budget')")}${lr('chart','Spending insights',st.label,"go('insights')")}${lr('cal','Bills &amp; subscriptions',S.subs.filter(x=>x.on).length+' active',"go('subs')")}</div>
 <div class="sec" style="margin-top:20px"><h2>Spending by category</h2></div><div class="card" style="padding:4px 14px 8px">${bars(st.cat.slice(0,4),st.cat.length?st.cat[0][1]:0)}</div></div>`},
budget:()=>{const st=spendStats(),pc=S.budget?st.curSp/S.budget*100:0;return pg('Budget planner','fin',`<div class="card" style="padding:16px"><span class="mut sm">${st.label}</span><div class="big" style="text-align:left;font-size:34px;margin:6px 0">${eur(st.curSp)} <span class="mut" style="font-size:16px">of ${eur(S.budget)}</span></div><div class="pb" role="img" aria-label="${Math.round(pc)} percent used"><i style="width:${Math.min(100,pc)}%;${pc>100?'background:var(--dn)':''}"></i></div><p class="sm" style="margin-top:8px;color:${pc>100?'var(--dn)':'var(--ink)'}">${pc>100?'Over budget by '+eur(st.curSp-S.budget):eur(S.budget-st.curSp)+' remaining'}</p></div>
 <div class="sec" style="margin-top:18px"><h2>By category</h2></div><div class="card" style="padding:4px 14px 8px">${bars(st.cat,st.curSp)}</div>
 ${inp('Monthly budget (€)','bv',S.bv==null?String(S.budget).replace('.',','):S.bv,'','inputmode="decimal" oninput="S.bv=this.value"')}${S.err?`<p class="err">${S.err}</p>`:''}<button class="btn" onclick="saveBudget()">Save budget</button>`)},
insights:()=>{const st=spendStats(),d=st.curSp-st.prevSp,mx=Math.max(st.curSp,st.prevSp,1);return pg('Spending insights','fin',`<div class="sum"><div><span class="mut">Total spending · ${st.label}</span><b>${eur(st.curSp)}</b></div><div><span class="mut">Change vs previous month</span><b style="color:${d>0?'var(--dn)':'var(--in)'}">${d>0?'▲ ':'▼ '}${eur(Math.abs(d))}</b></div></div>
 <div class="sec" style="margin-top:18px"><h2>Month comparison</h2></div><div class="card" style="padding:4px 14px 8px">${bars([['This month',st.curSp],['Previous month',st.prevSp]],mx)}</div>
 <div class="sec" style="margin-top:18px"><h2>By category</h2></div><div class="card" style="padding:4px 14px 8px">${bars(st.cat,st.cat.length?st.cat[0][1]:0)}</div>
 <div class="sec" style="margin-top:18px"><h2>Largest expenses</h2></div><div class="card">${st.top.map(txRow).join('')}</div><p class="mut sm" style="margin-top:12px">Calculated from the transactions in this demo (completed EUR payments only).</p>`)},
subs:()=>pg('Bills & subscriptions','fin',`<div class="sum"><div><span class="mut">Active per month</span><b>${eur(S.subs.filter(x=>x.on).reduce((a,x)=>a+x.a,0))}</b></div></div><div class="card" style="margin-top:14px">${S.subs.map((x,i)=>`<div class="row" style="flex-wrap:wrap"><div class="grow"><b>${x.n}</b><span class="mut sm">${x.s} · next ${x.next} · ${eur(x.a)} (estimate)</span></div><span class="pill" style="color:${x.on?'var(--in)':'var(--warn)'}">${x.on?'Active':'Cancelled'}</span><div style="display:flex;gap:8px;width:100%;margin-top:6px"><button class="chip" onclick="S.subs[${i}].on=!S.subs[${i}].on;draw()">${x.on?'Cancel (demo)':'Reactivate'}</button><button class="chip ${x.rem?'on':''}" aria-pressed="${x.rem}" onclick="S.subs[${i}].rem=!S.subs[${i}].rem;draw()">Reminder ${x.rem?'on':'off'}</button></div></div>`).join('')}</div><p class="mut sm" style="margin-top:12px">Demo list. Cancelling here doesn’t contact any provider.</p>`),
profile:()=>`<div class="scr"><div style="text-align:center;margin-bottom:16px"><div style="display:flex;justify-content:center">${av(S.prof.name).replace('class="av"','class="av" style="width:72px;height:72px;font-size:24px"')}</div><h1 style="margin-top:10px;font-size:22px">${S.prof.name}</h1><span class="mut sm">${S.prof.email}</span></div><span class="sim">Demo profile · no real account</span>
 <div class="card">${lr('user','Personal information','Name, email, phone',"go('pedit',{pd:{...S.prof}})")}${lr('shield','Security Centre','PIN, biometrics, devices',"go('security')")}${lr('bell','Notifications',S.notes.filter(n=>!n.read).length+' unread',"go('notifprefs')")}${lr('gear','Preferences','Language, currency, theme',"go('prefs')")}${lr('card','Linked accounts','Demo bank connections',"go('linked')")}${lr('help','Help &amp; support','FAQ, contact, report',"go('help')")}${lr('home','About EUONE','Version and notices',"go('about')")}</div></div>`,
pedit:()=>pg('Personal information','profile',`${inp('Full name','pn',S.pd.name,'','oninput="S.pd.name=this.value"')}${inp('Email','pe',S.pd.email,'','type="email" oninput="S.pd.email=this.value"')}${inp('Phone','pp',S.pd.phone,'','type="tel" oninput="S.pd.phone=this.value"')}${inp('City','pc',S.pd.city,'','oninput="S.pd.city=this.value"')}${S.err?`<p class="err">${S.err}</p>`:''}<button class="btn" onclick="saveProf()">Save</button><button class="btn ghost" onclick="go('profile')">Cancel</button>`),
security:()=>pg('Security Centre','profile',`<span class="sim">Prototype settings · no real security is active</span><div class="card">${lr('shield','PIN',S.pref.pin?'Set (demo)':'Not set',"go('pin',{p1:'',p2:''})")}${tgl('bio','Biometric sign-in','Face ID / fingerprint (not active in demo)')}${tgl('confirmPay','Confirm every payment','Always show a review step')}${tgl('hideBal','Hide balances','Mask amounts on Home and Finance')}${tgl('trust','Remember this device')}${lr('user','Trusted devices',S.devices.length+' devices',"go('devices')")}</div>`),
pin:()=>pg('Set a PIN','security',`<p class="mut sm">Prototype only: your PIN isn’t stored or used to protect anything.</p><label for="p1">New PIN</label><input class="inp" id="p1" type="password" inputmode="numeric" maxlength="4" autocomplete="off" value="${clean(S.p1)}" oninput="S.p1=this.value"><label for="p2">Repeat PIN</label><input class="inp" id="p2" type="password" inputmode="numeric" maxlength="4" autocomplete="off" value="${clean(S.p2)}" oninput="S.p2=this.value">${S.err?`<p class="err">${S.err}</p>`:''}<button class="btn" onclick="savePin()">Save PIN</button>${S.pref.pin?`<button class="btn ghost" onclick="S.pref.pin=false;go('security')">Remove PIN</button>`:''}`),
devices:()=>pg('Trusted devices','security',`<div class="card">${S.devices.map((d,i)=>`<div class="row"><div class="grow"><b>${d.n}</b><span class="mut sm">${d.cur?'Current device':'Trusted'}</span></div>${d.cur?'':`<button class="chip" onclick="S.devices.splice(${i},1);draw()">Remove</button>`}</div>`).join('')}</div>`),
notifs:()=>pg('Notifications','home',`<div style="display:flex;gap:18px;margin-bottom:10px"><button class="lnk" onclick="S.notes.forEach(n=>n.read=true);draw()">Mark all read</button><button class="lnk" onclick="S.notes=[];draw()">Clear all</button><button class="lnk" onclick="go('notifprefs')">Settings</button></div>${S.notes.length?`<div class="card">${S.notes.map(n=>`<div class="row"><button class="grow" style="text-align:left" onclick="S.notes.find(x=>x.id===${n.id}).read=true;draw()"><b>${n.read?'':'● '}${n.t}</b><span class="mut sm">${n.s} · ${n.d}</span></button><button class="lnk" aria-label="Dismiss" onclick="S.notes=S.notes.filter(x=>x.id!==${n.id});draw()">✕</button></div>`).join('')}</div>`:'<p class="mut" style="padding:24px;text-align:center">You’re all caught up.</p>'}`),
notifprefs:()=>pg('Notification settings','profile',`<div class="card">${tgl('nPay','Payments','Sent and received money')}${tgl('nReq','Requests','Request created or paid')}${tgl('nBudget','Budget alerts')}${tgl('nPromo','Product news')}${lr('bell','Open inbox',S.notes.filter(n=>!n.read).length+' unread',"go('notifs')")}</div>`),
prefs:()=>pg('Preferences','profile',`<h2 style="margin:4px 0 6px">Language</h2><div class="chips">${['English','Deutsch','Français','Polski'].map(l=>`<button class="chip ${S.pref.lang===l?'on':''}" onclick="S.pref.lang='${l}';draw()">${l}</button>`).join('')}</div><p class="mut sm">Selection saved; screens stay in English in this prototype.</p>
 <h2 style="margin:16px 0 6px">Preferred currency</h2><div class="chips">${['EUR','USD','GBP','PLN'].map(c=>`<button class="chip ${S.pref.cur===c?'on':''}" onclick="S.pref.cur='${c}';draw()">${c}</button>`).join('')}</div>
 <h2 style="margin:16px 0 6px">Theme</h2><div class="chips"><button class="chip ${S.pref.theme==='light'?'on':''}" onclick="S.pref.theme='light';applyPref();draw()">Light</button><button class="chip ${S.pref.theme!=='light'?'on':''}" onclick="S.pref.theme='system';applyPref();draw()">Match device</button></div>
 <div class="card" style="margin-top:12px">${tgl('large','Larger text')}${tgl('rm','Reduce motion','Stops the rate ticker scrolling')}</div>`),
linked:()=>pg('Linked accounts','profile',`<span class="sim">Demo interface · no bank is connected</span><div class="card"><div class="row"><div class="av" style="background:var(--acs);color:var(--ac)">${ic('card',20)}</div><div class="grow"><b>EUONE main account</b><span class="mut sm">Simulated · DE44 5001 •••• 7731</span></div></div></div><button class="btn" disabled>Connect a bank (coming later)</button><p class="mut sm" style="margin-top:12px">Real bank connections need a regulated open-banking integration.</p>`),
help:()=>pg('Help & support','profile',`<div class="card">${lr('help','FAQ','Common questions',"go('faq')")}${lr('send','Contact support','',"go('support',{sk:'contact',sent:false,sm:''})")}${lr('x','Report a problem','',"go('support',{sk:'report',sent:false,sm:''})")}${lr('home','About EUONE','',"go('about')")}</div>`),
faq:()=>pg('FAQ','help',[['Is this real money?','No. EUONE here is a prototype. Balances and payments are simulated.'],['How does Scan & Pay work?','Scan an EUONE or SEPA payment QR code, review the details, then confirm. Nothing is actually transferred.'],['Why do some exchange rates say DEMO DATA?','No live rate provider is connected yet, so the ticker shows a fixed sample dataset.'],['Does a request change my balance?','No. Your balance changes only when a payment is received.'],['Is my data saved?','Only for this session. Refreshing the page resets the demo.']].map(f=>`<details class="card" style="padding:12px 14px;margin-bottom:8px"><summary><b>${f[0]}</b></summary><p class="mut" style="margin-top:8px">${f[1]}</p></details>`).join('')),
support:()=>pg(S.sk==='report'?'Report a problem':'Contact support','help',S.sent?`<div class="ok">${ic('check',44)}</div><h2 style="text-align:center">Thanks, this is a demo</h2><p class="mut" style="text-align:center">Nothing was sent: this prototype has no backend.</p><button class="btn" onclick="go('help')">Done</button>`:`<label for="sm">${S.sk==='report'?'What went wrong?':'How can we help?'}</label><textarea class="inp" id="sm" rows="5" maxlength="500" oninput="S.sm=this.value">${clean(S.sm)}</textarea>${S.err?`<p class="err">${S.err}</p>`:''}<button class="btn" onclick="sendSupport()">Submit</button>`),
about:()=>pg('About EUONE','profile',`<div class="card" style="padding:18px;text-align:center"><b style="letter-spacing:.06em;color:var(--ac);font-size:22px">EUONE</b><p class="mut sm">Customer prototype · version 0.9 (demo)</p></div><p class="mut sm" style="margin-top:14px">All balances, payments, requests and rates are simulated. No real transfers, bank connections or authentication are active.</p>`),
send:()=>{const l=CON.filter(c=>c[0].toLowerCase().includes(S.q.toLowerCase()));
 return `<div class="scr">${head('Send money')}<input class="inp" id="q" placeholder="Search name or IBAN" value="${S.q}" oninput="S.q=this.value;draw('q')">
 <div class="sec" style="margin-top:18px"><h2>Contacts</h2><span><button class="lnk" onclick="go('addrec',{rn:'',ri:''})">Add new</button> &nbsp; <button class="lnk" onclick="go('scan',{qrTab:'scan'})">Scan instead</button></span></div>
 <div class="card">${l.map(c=>`<button class="row" onclick="go('amount',{to:'${c[0]}',amt:''})">${av(c[0])}<div class="grow"><b>${c[0]}</b><span class="mut sm">${c[1]}</span></div></button>`).join('')||'<p class="mut" style="padding:16px">No contact found. Check the spelling or enter an IBAN.</p>'}</div></div>`},

scan:()=>`<div class="scr">${head('Pay with QR')}
 <div class="chips"><button class="chip ${S.qrTab==='scan'?'on':''}" onclick="go('scan',{qrTab:'scan'})">Scan code</button><button class="chip ${S.qrTab==='my'?'on':''}" onclick="go('scan',{qrTab:'my'})">My code</button></div>
 ${S.qrTab==='scan'?`<div class="vf"><video id="camv" playsinline muted autoplay></video><i></i><p id="vfmsg">Starting camera…</p><button class="torch" id="torchbtn" hidden onclick="toggleTorch()" aria-label="Toggle flashlight">${ic('bolt')}</button></div>
 <div id="scanmsg" class="scanmsg" role="alert" hidden></div>
 <button class="btn" id="retrybtn" hidden style="margin-top:0" onclick="startCam()">Try camera again</button><button class="btn" id="againbtn" hidden style="margin-top:0" onclick="resume()">Scan again</button>
 <p class="mut sm" style="margin:14px 0 8px">Demo codes (no camera needed)</p>

function qrSvg(){const s=25,G=['..####.','.#....#','####...','.#.....','####...','.#....#','..####.'];let r='',seed=11;
 const fin=(x,y)=>{for(const [ox,oy] of [[0,0],[18,0],[0,18]]){const a=x-ox,b=y-oy;if(a>=0&&a<7&&b>=0&&b<7)return(a==0||a==6||b==0||b==6||(a>1&&a<5&&b>1&&b<5))?1:0}return -1};
 for(let y=0;y<s;y++)for(let x=0;x<s;x++){seed=(seed*9301+49297)%233280;const rnd=seed/233280>.5,f=fin(x,y);let on;
  if(f>=0)on=f==1;
  else if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16))on=false;
  else if(x>=8&&x<=16&&y>=8&&y<=16)on=false
  else if(y==6)on=x%2==0;else if(x==6)on=y%2==0;else on=rnd;
  if(on)r+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 return `<svg viewBox="-2 -2 29 29" width="208" height="208" shape-rendering="crispEdges" style="display:block;margin:0 auto;border-radius:14px;background:#fff" role="img" aria-label="Your EUONE payment QR code with the EUONE logo in the centre"><rect x="-2" y="-2" width="29" height="29" fill="#fff"/><g fill="#000">${r}</g><rect x="8" y="8" width="9" height="9" rx="1.8" fill="#fff"/><image href="${LOGO}" x="8.5" y="8.5" width="8" height="8"/></svg>`}

 for(let y=0;y<s;y++)for(let x=0;x<s;x++){seed=(seed*9301+49297)%233280;let on=f(x,y)?((x%7==0||x%7==6||y%7==0||y%7==6||(x%7>1&&x%7<5&&y%7>1&&y%7<5))&&!((x>=7&&x<=13&&y<8)||(y>=7&&y<=13&&x<8))):seed/233280>.5;

/* ===== EXCHANGE RATES · DATA LAYER (no UI code) =====
   Demo mode is used whenever FX_CONFIG.endpoint is empty. To go live, point `endpoint` at YOUR OWN
   backend proxy (it holds any API key and enforces the provider's rate limits). The proxy must answer
   GET {endpoint}/{start}..{end}?base=EUR&symbols=USD,GBP,...  with the Frankfurter/ECB time-series shape:
   {"rates":{"2026-10-22":{"USD":1.08,...},"2026-10-23":{...}}}. Never put API keys in this file. */
const FX_CONFIG={endpoint:'',base:'EUR',refreshMs:30*60*1000,staleAfterMs:4*864e5,historyDays:30,
 currencies:['USD','GBP','INR','CHF','PLN','CZK','SEK','NOK','JPY','CNY','AUD','CAD','HUF','DKK']};
const FXData={
 demo(){const B={USD:1.08,GBP:.85,INR:90,CHF:.95,PLN:4.3,CZK:25,SEK:11.4,NOK:11.7,JPY:160,CNY:7.8,AUD:1.65,CAD:1.48,HUF:395,DKK:7.46},P=[0,.35,.15,.55,.3,.7,.45,.85,.6,.75],hist={},rates={},prev={};
  FX_CONFIG.currencies.forEach((c,k)=>{hist[c]=P.map((_,i)=>({d:null,v:B[c]*(1+(P[(i+k*3)%P.length]-.5)*.012)}));rates[c]=hist[c][P.length-1].v;prev[c]=hist[c][P.length-2].v});
  return{mode:'demo',source:'Static sample dataset',asOf:null,prevDate:null,rates,prev,hist,period:'vs previous sample day'}},
 async load(cfg){if(!cfg.endpoint)return FXData.demo();
  const iso=d=>d.toISOString().slice(0,10),url=cfg.endpoint.replace(/\/$/,'')+'/'+iso(new Date(Date.now()-cfg.historyDays*864e5))+'..'+iso(new Date())+'?base='+cfg.base+'&symbols='+cfg.currencies.join(',');
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),8000);
  try{const r=await fetch(url,{signal:ctl.signal,headers:{Accept:'application/json'},credentials:'omit'});if(!r.ok)throw new Error('Provider returned HTTP '+r.status);return FXData.normalize(await r.json(),cfg)}finally{clearTimeout(to)}},
 normalize(j,cfg){if(!j||!j.rates)throw new Error('Unexpected response format');const days=Object.keys(j.rates).sort();if(days.length<2)throw new Error('Not enough rate history');
  const last=days[days.length-1],prev=days[days.length-2],hist={},ok=v=>typeof v==='number'&&isFinite(v)&&v>0;
  cfg.currencies.forEach(c=>{hist[c]=days.filter(d=>ok(j.rates[d][c])).map(d=>({d,v:j.rates[d][c]}))});
  const rates={},pv={};cfg.currencies.forEach(c=>{if(ok(j.rates[last][c])&&ok(j.rates[prev][c])){rates[c]=j.rates[last][c];pv[c]=j.rates[prev][c]}});
  if(!Object.keys(rates).length)throw new Error('No usable rates');
  return{mode:'live',source:'ECB reference rates',asOf:last,prevDate:prev,rates,prev:pv,hist,period:'vs previous reference day'}}};

 return `<button class="fxi" onclick="fxTap('${c}')" aria-label="EUR to ${c} ${fxFmt(r)}, ${p==null?'no change data':(p>=0?'up ':'down ')+Math.abs(p).toFixed(2)+' percent'}"><b>EUR/${c}</b><span>${fxFmt(r)}</span><em class="${cl}">${pctTxt(p)}</em></button>`}
function renderFx(){const el=document.getElementById('fx');if(!el)return;const st=FX.status,
 tag={demo:['DEMO DATA','dm'],live:['LIVE','lv'],stale:['STALE','st'],offline:['OFFLINE','st'],loading:['LOADING','dm'],error:['ERROR','st']}[st];let body;
 if(!FX.data)body=st==='loading'?'<span class="fxmsg">Loading exchange rates…</span>':'<button class="fxmsg" onclick="fxRefresh()">Rates unavailable. Tap to retry.</button>';
 else{const one=Object.keys(FX.data.rates).map(fxItem).join('');body=`<div class="fxtrack" id="fxtrack"><div class="fxset">${one}</div><div class="fxset" aria-hidden="true">${one.replace(/<button /g,'<button tabindex="-1" ')}</div></div>`}
 el.innerHTML=`<button class="fxtag ${tag[1]}" onclick="toast(fxNote())" aria-label="Rate data status: ${tag[0]}">${tag[0]}</button><div class="fxview" id="fxview">${body}</div>`;fxMeasure()}
function fxMeasure(){const tr=document.getElementById('fxtrack'),v=document.getElementById('fxview');FXUI.half=0;
 if(tr&&v){const w=tr.firstElementChild.getBoundingClientRect().width;FXUI.half=w>v.clientWidth?w:0;if(!FXUI.half)tr.style.transform='none'}}
function fxLoop(t){const dt=Math.min(50,t-(FXUI.t||t));FXUI.t=t;const tr=document.getElementById('fxtrack');
 if(tr&&FXUI.half){if(!FXUI.hover&&!FXUI.drag&&!FXUI.rm&&!document.hidden)FXUI.off+=dt*.035;FXUI.off=((FXUI.off%FXUI.half)+FXUI.half)%FXUI.half;tr.style.transform='translate3d('+(-FXUI.off)+'px,0,0)'}
 requestAnimationFrame(fxLoop)}
async function fxRefresh(){if(FX.busy)return;FX.busy=true;if(!FX.data){FX.status='loading';renderFx()}
 try{FX.data=await FXData.load(FX_CONFIG);FX.fetchedAt=Date.now();FX.err=''}catch(e){FX.err=(e&&e.name==='AbortError')?'Request timed out':String((e&&e.message)||e)}
 FX.busy=false;FX.status=fxStatus();renderFx();if(S.scr==='fx'&&!(document.activeElement&&document.activeElement.tagName==='INPUT'))draw()}
function fxTap(c){if(FXUI.moved)return;openFx(c)}
function openFx(c){const b=S.scr==='fx'?S.fxBack:S.scr;go('fx',{fxF:'EUR',fxT:c,fxA:S.fxA||'100',fxBack:b})}
function fxSwap(){const a=S.fxF;S.fxF=S.fxT;S.fxT=a;draw()}
function fxConv(){const t=String(S.fxA||'').trim().replace(',','.'),a=parseFloat(t),r=fxCross(S.fxF||'EUR',S.fxT||'USD','rates');
 if(!/^\d{1,12}(\.\d{1,4})?$/.test(t)||!isFinite(a)||r==null)return '–';const v=a*r;return v.toLocaleString('de-DE',{minimumFractionDigits:v<1?4:2,maximumFractionDigits:v<1?4:2})+' '+(S.fxT||'USD')}
function fxCalc(v){S.fxA=v;const e=document.getElementById('fxres');if(e)e.textContent=fxConv()}
function fxSeries(F,T){const h=FX.data.hist,base=h[F!=='EUR'?F:T]||[];if(!base.length)return[];const m=c=>c==='EUR'?null:new Map((h[c]||[]).map((x,i)=>[x.d||i,x.v])),mf=m(F),mt=m(T);
 return base.map((x,i)=>{const k=x.d||i,f=mf?mf.get(k):1,t=mt?mt.get(k):1;return f&&t?{d:x.d,v:t/f}:null}).filter(Boolean)}
function fxChart(ser){const W=300,H=90,v=ser.map(x=>x.v),mn=Math.min(...v),sp=(Math.max(...v)-mn)||1,
 q=ser.map((x,i)=>[i/(ser.length-1)*W,H-6-(x.v-mn)/sp*(H-12)]),p=q.map((a,i)=>(i?'L':'M')+a[0].toFixed(1)+' '+a[1].toFixed(1)).join('');
 return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="110" preserveAspectRatio="none" role="img" aria-label="Rate history chart"><path d="${p}L${W} ${H}L0 ${H}Z" fill="var(--acs)"/><path d="${p}" fill="none" stroke="var(--ac)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`}
function fxInit(){renderFx();fxRefresh();if(FX_CONFIG.endpoint)setInterval(fxRefresh,FX_CONFIG.refreshMs);
 window.addEventListener('online',fxRefresh);window.addEventListener('offline',()=>{FX.status=fxStatus();renderFx()});window.addEventListener('resize',fxMeasure);
 const el=document.getElementById('fx');
 el.addEventListener('pointerdown',e=>{if(!e.target.closest('.fxview')||!FXUI.half)return;FXUI.drag={x:e.clientX,o:FXUI.off};FXUI.moved=false});
 window.addEventListener('pointermove',e=>{const d=FXUI.drag;if(!d)return;const dx=e.clientX-d.x;if(Math.abs(dx)>6)FXUI.moved=true;if(FXUI.moved)FXUI.off=d.o-dx});
 window.addEventListener('pointerup',()=>{if(FXUI.drag){FXUI.drag=null;setTimeout(()=>{FXUI.moved=false},80)}});
 window.addEventListener('pointercancel',()=>{FXUI.drag=null;FXUI.moved=false});
 el.addEventListener('pointerenter',e=>{if(e.pointerType==='mouse')FXUI.hover=true});el.addEventListener('pointerleave',()=>{FXUI.hover=false});
 el.addEventListener('focusin',()=>{FXUI.hover=true});el.addEventListener('focusout',()=>{FXUI.hover=false});
 requestAnimationFrame(fxLoop)}

function draw(keep){const f=document.activeElement&&document.activeElement.id;$.innerHTML=V[S.scr]()+(NONAV.includes(S.scr)?'':nav());
 if(keep){const e=document.getElementById(keep);e.focus();e.setSelectionRange(e.value.length,e.value.length)}syncCam()}
applyPref();draw();fxInit();
</script></body></html>
